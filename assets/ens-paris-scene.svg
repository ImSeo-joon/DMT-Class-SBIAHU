    <path d="M1180 424h30v52h-30z"/><path d="M1180 424a15 15 0 0 1 30 0z"/>
    <path d="M1250 424h30v52h-30z"/><path d="M1250 424a15 15 0 0 1 30 0z"/>
    <path d="M1320 424h30v52h-30z"/><path d="M1320 424a15 15 0 0 1 30 0z"/>
  </g>

