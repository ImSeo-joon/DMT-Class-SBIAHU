  <g fill="#1b3a6b" opacity=".18">
    <path d="M0 352h1400v10H0z"/>
    <path d="M40 352v-16h36v16zM96 352v-24h30v24zM146 352v-14h44v14zM214 352v-20h26v20z"/>
    <path d="M980 352v-18h34v18zM1258 352v-22h30v22zM1320 352v-16h40v16z"/>
  </g>
  <g fill="#1b3a6b" opacity=".24">
