    <rect x="780" y="452" width="5" height="20"/><rect x="826" y="452" width="5" height="20"/>
    <rect x="872" y="452" width="5" height="20"/><rect x="918" y="452" width="5" height="20"/>
    <rect x="964" y="452" width="5" height="20"/><rect x="1010" y="452" width="5" height="20"/>
    <rect x="1226" y="452" width="5" height="20"/><rect x="1272" y="452" width="5" height="20"/>
    <rect x="1318" y="452" width="5" height="20"/><rect x="1364" y="452" width="5" height="20"/>
  </g>

  <!-- 前景：左侧石栏、铭牌与三本书 -->
  <path d="M0 402 L392 402 L392 560 L0 560 Z" fill="url(#stoneG)" opacity=".55"/>
  <path d="M0 402 L392 402 L392 418 L0 418 Z" fill="#1b3a6b" opacity=".26"/>
  <!-- 铭牌 -->
  <rect x="34" y="292" width="140" height="104" rx="4" fill="#f7f4ec" opacity=".75"/>
  <rect x="34" y="292" width="140" height="104" rx="4" fill="none" stroke="#1b3a6b" stroke-opacity=".30" stroke-width="2"/>
  <g fill="#1b3a6b" opacity=".40">
    <rect x="52" y="316" width="104" height="6"/>
    <rect x="52" y="332" width="72" height="6"/>
    <rect x="52" y="348" width="88" height="6"/>
    <rect x="52" y="364" width="60" height="6"/>
