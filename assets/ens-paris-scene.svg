  <g>
    <rect x="1050" y="230" width="200" height="246" fill="#1b3a6b" opacity=".34"/>
    <rect x="1040" y="222" width="220" height="12" fill="#1b3a6b" opacity=".52"/>
    <path d="M1040 222 L1150 178 L1260 222 Z" fill="#1b3a6b" opacity=".30"/>
    <rect x="1078" y="150" width="144" height="30" fill="#1b3a6b" opacity=".38"/>
    <path d="M1150 66c50 0 90 38 90 84h-180c0-46 40-84 90-84z" fill="#1b3a6b" opacity=".52"/>
    <path d="M1150 40c16 0 27 12 27 26h-54c0-14 11-26 27-26z" fill="#1b3a6b" opacity=".46"/>
    <rect x="1145" y="18" width="10" height="24" fill="#1b3a6b" opacity=".52"/>
    <circle cx="1150" cy="14" r="5" fill="#1b3a6b" opacity=".52"/>
    <path d="M1126 372h48v104h-48z" fill="#f7f4ec" opacity=".48"/>
