  <g fill="#1b3a6b" opacity=".24">
    <circle cx="120" cy="336" r="46"/><circle cx="186" cy="352" r="34"/><circle cx="58" cy="352" r="30"/>
    <circle cx="410" cy="330" r="50"/><circle cx="486" cy="348" r="36"/><circle cx="352" cy="352" r="28"/>
    <circle cx="596" cy="342" r="40"/><circle cx="656" cy="356" r="30"/>
    <circle cx="1300" cy="338" r="44"/><circle cx="1366" cy="352" r="32"/>
  </g>

