  <path d="M772 300 L824 236 L1400 236 L1400 300 Z" fill="url(#roofG)"/>
  <g fill="#f7f4ec" opacity=".62">
    <path d="M846 268h22l-11-16z"/><rect x="846" y="268" width="22" height="26"/>
    <path d="M914 268h22l-11-16z"/><rect x="914" y="268" width="22" height="26"/>
    <path d="M982 268h22l-11-16z"/><rect x="982" y="268" width="22" height="26"/>
    <path d="M1244 268h22l-11-16z"/><rect x="1244" y="268" width="22" height="26"/>
    <path d="M1312 268h22l-11-16z"/><rect x="1312" y="268" width="22" height="26"/>
    <path d="M1368 268h20l-10-15z"/><rect x="1368" y="268" width="20" height="24"/>
  </g>
  <g fill="#1b3a6b" opacity=".42">
