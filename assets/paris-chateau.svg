    <rect x="300" y="260" width="60" height="120"/>
    <polygon points="300,260 312,228 348,228 360,260"/>
    <rect x="840" y="260" width="60" height="120"/>
    <polygon points="840,260 852,228 888,228 900,260"/>
    <!-- 两翼 -->
    <rect x="360" y="240" width="160" height="140"/>
    <polygon points="360,240 378,204 502,204 520,240"/>
    <rect x="680" y="240" width="160" height="140"/>
    <polygon points="680,240 698,204 822,204 840,240"/>
    <!-- 中央亭 -->
    <rect x="520" y="200" width="160" height="180"/>
    <polygon points="520,200 546,150 654,150 680,200"/>
    <!-- 屋顶小灯亭 -->
    <rect x="592" y="122" width="16" height="30"/>
    <ellipse cx="600" cy="116" rx="11" ry="14"/>
    <rect x="598" y="96" width="4" height="12"/>
    <!-- 烟囱 -->
    <rect x="392" y="184" width="12" height="24"/>
    <rect x="470" y="184" width="12" height="24"/>
    <rect x="718" y="184" width="12" height="24"/>
    <rect x="796" y="184" width="12" height="24"/>
    <rect x="560" y="128" width="12" height="24"/>
    <rect x="630" y="128" width="12" height="24"/>
    <rect x="318" y="240" width="10" height="22"/>
    <rect x="872" y="240" width="10" height="22"/>
    <!-- 老虎窗 -->
    <rect x="410" y="212" width="14" height="20"/>
    <rect x="456" y="212" width="14" height="20"/>
    <rect x="730" y="212" width="14" height="20"/>
    <rect x="776" y="212" width="14" height="20"/>
    <rect x="562" y="162" width="14" height="22"/>
    <rect x="624" y="162" width="14" height="22"/>
    <rect x="322" y="238" width="12" height="18"/>
    <rect x="866" y="238" width="12" height="18"/>
