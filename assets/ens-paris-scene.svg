    <path d="M852 356h24v40h-24z"/><path d="M852 356a12 12 0 0 1 24 0z"/>
    <path d="M904 356h24v40h-24z"/><path d="M904 356a12 12 0 0 1 24 0z"/>
    <path d="M956 356h24v40h-24z"/><path d="M956 356a12 12 0 0 1 24 0z"/>
    <path d="M1176 356h24v40h-24z"/><path d="M1176 356a12 12 0 0 1 24 0z"/>
    <path d="M1228 356h24v40h-24z"/><path d="M1228 356a12 12 0 0 1 24 0z"/>
    <path d="M1280 356h24v40h-24z"/><path d="M1280 356a12 12 0 0 1 24 0z"/>
    <path d="M1332 356h24v40h-24z"/><path d="M1332 356a12 12 0 0 1 24 0z"/>
