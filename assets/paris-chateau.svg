<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Château français et son jardin">
  <title>Château français · 法式庄园</title>
  <defs>
    <clipPath id="body">
      <rect x="300" y="260" width="600" height="120"/>
      <rect x="360" y="240" width="480" height="140"/>
      <rect x="520" y="200" width="160" height="180"/>
    </clipPath>
  </defs>

  <!-- 远处树带 -->
  <g fill="#2f3049" opacity=".22">
    <circle cx="90" cy="300" r="40"/><circle cx="140" cy="310" r="30"/><circle cx="40" cy="312" r="26"/>
    <circle cx="1090" cy="298" r="42"/><circle cx="1040" cy="310" r="30"/><circle cx="1150" cy="312" r="26"/>
  </g>

  <!-- 主体：中央亭 + 两翼 + 两端亭 -->
  <g fill="#2f3049">
