  <!-- 三本摞起来的书 -->
  <g>
    <rect x="60" y="424" width="300" height="34" rx="3" fill="#1b3a6b" opacity=".52"/>
    <rect x="74" y="396" width="272" height="30" rx="3" fill="#1b3a6b" opacity=".34"/>
    <rect x="88" y="370" width="244" height="28" rx="3" fill="#1b3a6b" opacity=".46"/>
    <g fill="#f7f4ec" opacity=".60">
      <rect x="86" y="432" width="120" height="5"/>
      <rect x="100" y="404" width="104" height="5"/>
      <rect x="114" y="378" width="96" height="5"/>
    </g>
    <path d="M60 424h8v34h-8zM344 424h16v34h-16z" fill="#1b3a6b" opacity=".40"/>
  </g>
  <!-- 摊开的笔记本与笔 -->
  <g fill="#1b3a6b" opacity=".26">
    <path d="M120 470h300l-14 40H134z"/>
    <path d="M120 470h150l-6 40H134z" opacity=".8"/>
    <rect x="240" y="486" width="120" height="6" rx="3" opacity=".7"/>
    <rect x="360" y="500" width="110" height="5" rx="2" opacity=".7"/>
  </g>
</svg>
