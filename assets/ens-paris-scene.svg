<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-label="Ecole normale superieure, Paris, vue depuis la terrasse">
  <title>Ecole normale superieure · 巴黎高师远眺</title>
  <defs>
    <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity=".04"/>
      <stop offset=".55" stop-color="#1b3a6b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="stoneG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec" stop-opacity=".9"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="facadeG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294d" stop-opacity=".52"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity=".30"/>
    </linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1f3a" stop-opacity=".68"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity=".40"/>
    </linearGradient>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="1400" height="560" fill="url(#skyG)"/>
  <g fill="#ffffff" opacity=".55">
