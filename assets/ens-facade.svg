<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Facade de l'Ecole normale superieure, rue d'Ulm">
  <title>Ecole normale superieure · 巴黎高师主楼</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.48"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#122545" stop-opacity="0.74"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1f3a" stop-opacity="0.83"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="dome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16294d" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.54"/>
    </linearGradient>
  </defs>

  <!-- 天空：极淡的纵向渐变，给画面一点空气感 -->
  <rect x="0" y="0" width="1200" height="420" fill="url(#sky)"/>

  <!-- 远树带 -->
  <g fill="#1b3a6b" opacity="0.26">
    <circle cx="470" cy="330" r="26"/><circle cx="516" cy="336" r="20"/>
    <circle cx="836" cy="330" r="22"/><circle cx="876" cy="336" r="18"/>
  </g>

  <!-- 左侧：矮墙 + 树 + 路灯（不对称的那一半） -->
  <g fill="#1b3a6b">
    <rect x="36" y="330" width="250" height="36" opacity="0.48"/>
    <rect x="28" y="322" width="266" height="10" opacity="0.61"/>
    <g opacity="0.54">
      <rect x="144" y="248" width="13" height="76"/>
      <circle cx="150" cy="232" r="44"/><circle cx="106" cy="252" r="28"/><circle cx="196" cy="248" r="25"/>
    </g>
    <g opacity="0.48">
      <rect x="318" y="286" width="4" height="78"/>
      <path d="M312 286h16l-4-12h-8z"/>
      <circle cx="320" cy="272" r="5"/>
    </g>
  </g>

  <!-- 主楼：孟莎屋顶 -->
  <path d="M520 268 L578 206 L1148 206 L1180 268 Z" fill="url(#roof)"/>
  <!-- 老虎窗 -->
  <g fill="#f4f1e9" opacity="0.88">
    <path d="M604 240h22l-11-16z"/><rect x="604" y="240" width="22" height="24"/>
    <path d="M688 240h22l-11-16z"/><rect x="688" y="240" width="22" height="24"/>
    <path d="M772 240h22l-11-16z"/><rect x="772" y="240" width="22" height="24"/>
    <path d="M1024 240h22l-11-16z"/><rect x="1024" y="240" width="22" height="24"/>
    <path d="M1092 240h22l-11-16z"/><rect x="1092" y="240" width="22" height="24"/>
  </g>
  <!-- 烟囱 -->
  <g fill="#1b3a6b" opacity="0.64">
    <rect x="628" y="176" width="17" height="34"/><rect x="660" y="188" width="14" height="22"/>
    <rect x="1064" y="180" width="16" height="30"/>
  </g>

  <!-- 主楼立面 -->
  <rect x="520" y="268" width="660" height="98" fill="url(#stone)"/>
  <rect x="510" y="260" width="680" height="12" opacity="0.74" fill="#1b3a6b"/>
  <rect x="520" y="300" width="660" height="4" opacity="0.35" fill="#f4f1e9"/>

  <!-- 拱窗两排 -->
  <g fill="#f4f1e9" opacity="0.77">
    <path d="M556 318h24v40h-24z"/><path d="M556 318a12 12 0 0 1 24 0z"/>
    <path d="M608 318h24v40h-24z"/><path d="M608 318a12 12 0 0 1 24 0z"/>
    <path d="M660 318h24v40h-24z"/><path d="M660 318a12 12 0 0 1 24 0z"/>
    <path d="M712 318h24v40h-24z"/><path d="M712 318a12 12 0 0 1 24 0z"/>
    <path d="M764 318h24v40h-24z"/><path d="M764 318a12 12 0 0 1 24 0z"/>
    <path d="M1052 318h24v40h-24z"/><path d="M1052 318a12 12 0 0 1 24 0z"/>
    <path d="M1104 318h24v40h-24z"/><path d="M1104 318a12 12 0 0 1 24 0z"/>
    <path d="M1156 318h20v40h-20z"/><path d="M1156 318a10 10 0 0 1 20 0z"/>
  </g>

  <!-- 中央亭：鼓座 + 穹顶 + 灯笼 + 旗 -->
  <g fill="#1b3a6b">
    <rect x="872" y="196" width="164" height="170" opacity="0.64"/>
    <rect x="862" y="188" width="184" height="12" opacity="0.83"/>
    <rect x="898" y="150" width="112" height="42" opacity="0.7"/>
    <path d="M954 74c46 0 82 32 82 76H872c0-44 36-76 82-76z" fill="url(#dome)"/>
    <rect x="948" y="46" width="12" height="30" opacity="0.86"/>
    <circle cx="954" cy="42" r="7" opacity="0.86"/>
    <path d="M946 262h28v104h-28z" opacity="0.92"/>
    <path d="M946 262a14 14 0 0 1 28 0z" opacity="0.92"/>
    <path d="M900 232h108v7" opacity="0.45"/>
  </g>
  <!-- 旗杆：唯一的竖向高元素 -->
  <g fill="#1b3a6b" opacity="0.83">
    <rect x="1006" y="104" width="4" height="84"/>
    <path d="M1010 110h36l-10 12 10 12h-36z"/>
  </g>

  <!-- 台阶与栏杆 -->
  <g fill="#1b3a6b">
    <rect x="846" y="366" width="250" height="8" opacity="0.54"/>
    <rect x="832" y="374" width="278" height="8" opacity="0.42"/>
    <g opacity="0.48">
      <rect x="556" y="356" width="150" height="4"/>
      <rect x="560" y="348" width="4" height="10"/><rect x="586" y="348" width="4" height="10"/>
      <rect x="612" y="348" width="4" height="10"/><rect x="638" y="348" width="4" height="10"/>
      <rect x="664" y="348" width="4" height="10"/><rect x="690" y="348" width="4" height="10"/>
    </g>
  </g>

  <!-- 地面 -->
  <rect x="0" y="380" width="1200" height="40" fill="#1b3a6b" opacity="0.19"/>
</svg>
