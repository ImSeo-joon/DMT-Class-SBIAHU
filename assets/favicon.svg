<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DMT Class 01">
  <title>DMT Class 01</title>
  <defs>
    <clipPath id="frame"><rect width="64" height="64" rx="13.5"/></clipPath>

    <!-- 底色：暮色花园的靛蓝，上浅下深，像傍晚画到一半的画布 -->
    <linearGradient id="ground" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#414a86"/>
      <stop offset="0.42" stop-color="#575c9f"/>
      <stop offset="0.74" stop-color="#48608e"/>
      <stop offset="1" stop-color="#2f3f6b"/>
    </linearGradient>

    <!-- 五个色点：玫瑰 / 暖金 / 鼠尾草 / 奶油 / 紫藤，都是低饱和的油画颜料 -->
    <radialGradient id="dabRose" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cd8f95" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#cd8f95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dabGold" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d9b169" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#d9b169" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dabSage" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#88a67e" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#88a67e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dabCream" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7f0dd" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f7f0dd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dabIris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9c8fd0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#9c8fd0" stop-opacity="0"/>
    </radialGradient>

    <!-- 陈金：与站上金线、法文小字同一支颜色 -->
    <linearGradient id="gilt" x1="0.12" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#fdf5dc"/>
      <stop offset="0.28" stop-color="#f0d79f"/>
      <stop offset="0.62" stop-color="#cda25a"/>
      <stop offset="1" stop-color="#9c722a"/>
    </linearGradient>

    <!-- 帆布经纬：斜纹的细线，任何尺寸下都在 -->
    <pattern id="weave" width="2" height="2" patternUnits="userSpaceOnUse">
      <path d="M0 0H2M0 1H2" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.28"/>
      <path d="M0 0V2M1 0V2" stroke="#000000" stroke-opacity="0.055" stroke-width="0.28"/>
    </pattern>

    <!-- 把色点边缘揉开，出现手抹过去的笔触感 -->
    <filter id="brush" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09 0.16" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="lift"><feDropShadow dx="0" dy="0.8" stdDeviation="0.9" flood-color="#0d1030" flood-opacity="0.5"/></filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="64" height="64" fill="url(#ground)"/>

    <!-- 色点：一坨一坨按上去，像印象派的破碎笔触 -->
    <g filter="url(#brush)">
      <ellipse cx="12" cy="9" rx="20" ry="14" transform="rotate(-20 12 9)" fill="url(#dabIris)"/>
      <ellipse cx="52" cy="7" rx="18" ry="12" transform="rotate(14 52 7)" fill="url(#dabRose)"/>
      <ellipse cx="60" cy="30" rx="16" ry="15" transform="rotate(30 60 30)" fill="url(#dabCream)"/>
      <ellipse cx="16" cy="54" rx="22" ry="14" transform="rotate(-10 16 54)" fill="url(#dabGold)"/>
      <ellipse cx="50" cy="58" rx="20" ry="13" transform="rotate(8 50 58)" fill="url(#dabSage)"/>
      <ellipse cx="33" cy="34" rx="24" ry="18" fill="url(#dabCream)"/>
    </g>

    <!-- 帆布经纬压在色点上 -->
    <rect width="64" height="64" fill="url(#weave)"/>

    <!-- 暗角：四角压一点靛蓝，中间留亮 -->
    <radialGradient id="vignette" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.5" stop-color="#0c1234" stop-opacity="0"/>
      <stop offset="1" stop-color="#0c1234" stop-opacity="0.42"/>
    </radialGradient>
    <rect width="64" height="64" fill="url(#vignette)"/>
  </g>

  <!-- 金线内框：像画布的压边 -->
  <rect x="3.1" y="3.1" width="57.8" height="57.8" rx="11.4" fill="none" stroke="url(#gilt)" stroke-width="1.25" opacity="0.92"/>

  <!-- 百合花徽：班级的记号 -->
  <g fill="url(#gilt)" filter="url(#lift)" transform="translate(32 34.7) scale(0.94) translate(-32 -32.6)">
    <path d="M32 40C27 32.8 27 18.6 32 11.4C37 18.6 37 32.8 32 40Z" transform="rotate(-40 32 40)"/>
    <path d="M32 40C27 32.8 27 18.6 32 11.4C37 18.6 37 32.8 32 40Z" transform="rotate(40 32 40)"/>
    <path d="M32 40.6C26.6 32.6 25.8 18.8 32 8.2C38.2 18.8 37.4 32.6 32 40.6Z"/>
    <rect x="22.8" y="36.2" width="18.4" height="5.4" rx="2.7"/>
    <path d="M29.7 42.4H34.3C34.2 45.8 33.6 47.8 35.2 50C35.7 50.6 35.3 51.3 34.5 51.3H29.5C28.7 51.3 28.3 50.6 28.8 50C30.4 47.8 29.8 45.8 29.7 42.4Z"/>
  </g>
</svg>
