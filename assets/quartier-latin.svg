<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Toits du Quartier latin, Paris">
  <title>Quartier latin · 拉丁区屋顶</title>
  <defs>
    <linearGradient id="qsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122545" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.54"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.22"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="420" fill="url(#qsky)"/>

  <!-- 远景屋顶：淡 -->
  <g fill="url(#far)">
    <path d="M0 310l70-30 70 30v72H0z"/>
    <path d="M140 296l84-38 84 38v86h-168z"/>
    <path d="M308 306l62-28 62 28v66H308z"/>
    <path d="M432 320l54-24 54 24v58H432z"/>
  </g>

  <!-- 中景：屋顶、烟囱与老虎窗 -->
  <g fill="#1b3a6b" opacity="0.48">
    <path d="M540 292l96-44 96 44v92H540z"/>
    <rect x="622" y="212" width="13" height="38"/><rect x="576" y="242" width="10" height="26"/>
    <path d="M660 268h26l-13-18z"/><rect x="660" y="268" width="26" height="22" fill="#f4f1e9"/>
    <path d="M732 274h24l-12-16z"/><rect x="732" y="274" width="24" height="20" fill="#f4f1e9"/>
  </g>

  <!-- 穹顶（先贤祠式）：中心 900，不在画面正中 -->
  <g>
    <rect x="836" y="240" width="128" height="118" fill="url(#near)"/>
    <rect x="828" y="232" width="144" height="10" fill="#1b3a6b" opacity="0.83"/>
    <g fill="#f4f1e9" opacity="0.77">
      <rect x="852" y="266" width="12" height="70"/><rect x="876" y="266" width="12" height="70"/>
      <rect x="900" y="266" width="12" height="70"/><rect x="924" y="266" width="12" height="70"/>
    </g>
    <rect x="862" y="196" width="76" height="40" fill="#1b3a6b" opacity="0.74"/>
    <g fill="#f4f1e9" opacity="0.67">
      <rect x="870" y="206" width="10" height="24"/><rect x="890" y="206" width="10" height="24"/>
      <rect x="910" y="206" width="10" height="24"/><rect x="930" y="206" width="8" height="24"/>
    </g>
    <path d="M900 132c36 0 64 28 64 64H836c0-36 28-64 64-64z" fill="#1b3a6b" opacity="0.8"/>
    <path d="M900 104c14 0 24 12 24 28h-48c0-16 10-28 24-28z" fill="#1b3a6b" opacity="0.74"/>
    <rect x="895" y="86" width="10" height="22" fill="#1b3a6b" opacity="0.8"/>
    <circle cx="900" cy="82" r="6" fill="#1b3a6b" opacity="0.8"/>
  </g>

  <!-- 近景最右一栋，压住画面 -->
  <g>
    <path d="M1010 286l92-42 92 42v98h-184z" fill="url(#near)"/>
    <rect x="1084" y="212" width="14" height="32" fill="#1b3a6b" opacity="0.64"/>
    <rect x="1040" y="248" width="11" height="24" fill="#1b3a6b" opacity="0.54"/>
    <g fill="#f4f1e9" opacity="0.7">
      <path d="M1046 300h22l-11-15z"/><rect x="1046" y="300" width="22" height="20"/>
      <path d="M1098 300h22l-11-15z"/><rect x="1098" y="300" width="22" height="20"/>
      <path d="M1150 300h20l-10-14z"/><rect x="1150" y="300" width="20" height="20"/>
    </g>
  </g>

  <!-- 一条极细的街道留白，打断屋顶的连续节奏 -->
  <rect x="486" y="330" width="34" height="54" fill="#f4f1e9" opacity="0.64"/>

  <rect x="0" y="384" width="1200" height="36" fill="#1b3a6b" opacity="0.19"/>
</svg>
