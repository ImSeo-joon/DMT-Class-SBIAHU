<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Cour et jardin de l'Ecole normale superieure">
  <title>Cour d'honneur · 巴黎高师中庭</title>
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a6b" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16294d" stop-opacity="0.77"/>
      <stop offset="1" stop-color="#1b3a6b" stop-opacity="0.51"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="420" fill="url(#cg)"/>

  <!-- 左侧连拱廊（重量偏左） -->
  <g>
    <rect x="30" y="176" width="366" height="180" fill="url(#arc)"/>
    <rect x="18" y="164" width="392" height="14" fill="#1b3a6b" opacity="0.86"/>
    <rect x="18" y="186" width="392" height="5" fill="#f4f1e9" opacity="0.48"/>
    <g fill="#f4f1e9" opacity="0.92">
      <path d="M56 356v-104a30 30 0 0 1 60 0v104z"/>
      <path d="M148 356v-104a30 30 0 0 1 60 0v104z"/>
      <path d="M240 356v-104a30 30 0 0 1 60 0v104z"/>
      <path d="M332 356v-104a28 28 0 0 1 52 0v104z"/>
    </g>
    <!-- 拱廊上的圆浮雕 -->
    <g fill="#1b3a6b" opacity="0.54">
      <circle cx="86" cy="212" r="13"/><circle cx="178" cy="212" r="13"/>
      <circle cx="270" cy="212" r="13"/><circle cx="358" cy="212" r="12"/>
    </g>
  </g>

  <!-- 中景：喷泉（偏中右） -->
  <g fill="#1b3a6b">
    <ellipse cx="742" cy="340" rx="94" ry="17" opacity="0.54"/>
    <rect x="734" y="296" width="17" height="46" opacity="0.64"/>
    <ellipse cx="742" cy="292" rx="50" ry="12" opacity="0.67"/>
    <path d="M742 224c11 24 11 44 0 64-11-20-11-40 0-64z" opacity="0.74"/>
    <ellipse cx="742" cy="222" rx="7" ry="4" opacity="0.74"/>
  </g>

  <!-- 最右：一棵树压在边缘 -->
  <g fill="#1b3a6b" opacity="0.54">
    <rect x="1042" y="228" width="15" height="120"/>
    <circle cx="1049" cy="208" r="54"/><circle cx="994" cy="238" r="34"/><circle cx="1104" cy="230" r="30"/>
    <circle cx="1058" cy="160" r="26"/>
  </g>

  <!-- 中景长椅与盆栽 -->
  <g fill="#1b3a6b" opacity="0.45">
    <rect x="476" y="332" width="128" height="9"/>
    <rect x="488" y="341" width="8" height="16"/><rect x="580" y="341" width="8" height="16"/>
    <rect x="490" y="318" width="100" height="6"/>
    <path d="M846 356h50l-7-24h-36z"/>
    <circle cx="871" cy="324" r="14"/>
  </g>

  <!-- 地面铺装：三组线，疏密不等 -->
  <g fill="#1b3a6b" opacity="0.26">
    <rect x="396" y="368" width="804" height="3"/>
    <rect x="396" y="384" width="804" height="3"/>
    <rect x="396" y="400" width="804" height="3"/>
  </g>
</svg>
