  <!-- 立面上的门窗（比主体深一点） -->
  <g clip-path="url(#body)" fill="#15162a" opacity=".42">
    <rect x="316" y="290" width="14" height="30"/><rect x="342" y="290" width="14" height="30"/>
    <rect x="858" y="290" width="14" height="30"/><rect x="884" y="290" width="14" height="30"/>
    <g>
      <rect x="378" y="266" width="16" height="32"/><rect x="412" y="266" width="16" height="32"/><rect x="446" y="266" width="16" height="32"/><rect x="480" y="266" width="16" height="32"/>
      <rect x="378" y="316" width="16" height="34"/><rect x="412" y="316" width="16" height="34"/><rect x="446" y="316" width="16" height="34"/><rect x="480" y="316" width="16" height="34"/>
      <rect x="698" y="266" width="16" height="32"/><rect x="732" y="266" width="16" height="32"/><rect x="766" y="266" width="16" height="32"/><rect x="800" y="266" width="16" height="32"/>
      <rect x="698" y="316" width="16" height="34"/><rect x="732" y="316" width="16" height="34"/><rect x="766" y="316" width="16" height="34"/><rect x="800" y="316" width="16" height="34"/>
    </g>
    <g>
      <rect x="538" y="226" width="18" height="34"/><rect x="572" y="226" width="18" height="34"/><rect x="610" y="226" width="18" height="34"/><rect x="644" y="226" width="18" height="34"/>
      <rect x="538" y="278" width="18" height="34"/><rect x="572" y="278" width="18" height="34"/><rect x="610" y="278" width="18" height="34"/><rect x="644" y="278" width="18" height="34"/>
      <rect x="586" y="332" width="28" height="48" rx="14"/>
    </g>
  </g>

  <!-- 露台 -->
  <g fill="#2f3049">
    <rect x="286" y="380" width="628" height="8"/>
    <g opacity=".6">
      <rect x="300" y="366" width="4" height="14"/><rect x="324" y="366" width="4" height="14"/><rect x="348" y="366" width="4" height="14"/>
      <rect x="372" y="366" width="4" height="14"/><rect x="396" y="366" width="4" height="14"/><rect x="420" y="366" width="4" height="14"/>
      <rect x="444" y="366" width="4" height="14"/><rect x="468" y="366" width="4" height="14"/><rect x="492" y="366" width="4" height="14"/>
      <rect x="516" y="366" width="4" height="14"/><rect x="540" y="366" width="4" height="14"/><rect x="564" y="366" width="4" height="14"/>
      <rect x="588" y="366" width="4" height="14"/><rect x="612" y="366" width="4" height="14"/><rect x="636" y="366" width="4" height="14"/>
      <rect x="660" y="366" width="4" height="14"/><rect x="684" y="366" width="4" height="14"/><rect x="708" y="366" width="4" height="14"/>
      <rect x="732" y="366" width="4" height="14"/><rect x="756" y="366" width="4" height="14"/><rect x="780" y="366" width="4" height="14"/>
      <rect x="804" y="366" width="4" height="14"/><rect x="828" y="366" width="4" height="14"/><rect x="852" y="366" width="4" height="14"/>
      <rect x="876" y="366" width="4" height="14"/><rect x="900" y="366" width="4" height="14"/>
