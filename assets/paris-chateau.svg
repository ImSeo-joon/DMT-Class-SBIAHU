  <!-- 前景花园：绿篱、锥形修剪、喷泉、小径 -->
  <g fill="#2f3049" opacity=".5">
    <ellipse cx="150" cy="408" rx="150" ry="26"/>
    <ellipse cx="1050" cy="408" rx="150" ry="26"/>
    <ellipse cx="330" cy="418" rx="120" ry="22"/>
    <ellipse cx="870" cy="418" rx="120" ry="22"/>
  </g>
  <g fill="#2f3049">
    <polygon points="196,372 208,320 220,372"/>
    <polygon points="980,372 992,320 1004,372"/>
    <polygon points="150,378 160,336 170,378"/>
    <polygon points="1030,378 1040,336 1050,378"/>
    <circle cx="252" cy="376" r="14"/>
    <circle cx="948" cy="376" r="14"/>
  </g>
  <g fill="#2f3049" opacity=".38">
    <ellipse cx="600" cy="406" rx="62" ry="16"/>
    <rect x="596" y="368" width="8" height="38"/>
    <ellipse cx="600" cy="362" rx="10" ry="6"/>
    <path d="M600 356c-8-10-12-16-12-22a12 12 0 0 1 24 0c0 6-4 12-12 22Z"/>
  </g>
